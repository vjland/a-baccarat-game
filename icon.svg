<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="darkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#020205;stop-opacity:1" />
    </radialGradient>
    
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#darkBg)" />

  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#neonCyan)" stroke-width="8" filter="url(#glow)" opacity="0.8" />

  <rect x="190" y="150" width="110" height="160" rx="12" fill="#ffffff" transform="rotate(-10 245 230)" opacity="0.1" stroke="#00f2ff" stroke-width="2" />
  <rect x="230" y="140" width="110" height="160" rx="12" fill="#00f2ff" transform="rotate(15 285 220)" opacity="0.2" stroke="#ffffff" stroke-width="2" />

  <text x="50%" y="52%" dominant-baseline="middle" text-anchor="middle" 
        style="fill:#ffffff; font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; font-size: 220px; font-weight: 900; filter: url(#glow);">
    B
  </text>

  <text x="50%" y="85%" dominant-baseline="middle" text-anchor="middle" 
        style="fill:url(#neonCyan); font-family: 'Verdana', sans-serif; font-size: 28px; letter-spacing: 12px; font-weight: bold; text-transform: uppercase;">
    BACCARAT
  </text>
  
  <rect x="0" y="0" width="512" height="512" rx="100" fill="white" opacity="0.03" style="pointer-events:none;"/>
</svg>