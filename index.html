
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baccarat Pro Trainer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #e5e5e5;
            overflow-x: hidden;
        }
        .casino-gradient {
            background: radial-gradient(circle at center, #1a4731 0%, #0a1f14 100%);
        }
        .roadmap-grid {
            background-size: 20px 20px;
            background-image: linear-gradient(to right, #2a2a2a 1px, transparent 1px),
                              linear-gradient(to bottom, #2a2a2a 1px, transparent 1px);
        }
        .card-shadow {
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Win Splash Animations */
        @keyframes win-burst {
            0% { transform: scale(0.5); opacity: 0; filter: blur(10px); }
            20% { transform: scale(1.1); opacity: 1; filter: blur(0); }
            80% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.2); opacity: 0; }
        }
        @keyframes winner-flash {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.05); filter: brightness(1.4); }
        }
        .win-splash-text {
            background: linear-gradient(90deg, #facc15, #fef08a, #facc15);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }
        .animate-win-burst {
            animation: win-burst 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-winner-flash {
            animation: winner-flash 0.6s ease-in-out infinite;
        }
        @keyframes shine {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
    </style>
