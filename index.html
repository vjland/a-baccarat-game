<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>bac pro</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #e5e5e5;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        .safe-area-inset {
            padding-bottom: env(safe-area-inset-bottom);
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes win-burst {
            0% { transform: scale(0.5); opacity: 0; filter: blur(10px); }
            20% { transform: scale(1.1); opacity: 1; filter: blur(0); }
            80% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.2); opacity: 0; }
        }
        .animate-win-burst { animation: win-burst 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes winner-flash {
            0%, 100% { filter: brightness(1) drop-shadow(0 0 0px transparent); transform: scale(1); }
            50% { filter: brightness(1.3) drop-shadow(0 0 15px currentColor); transform: scale(1.05); }
        }
        .animate-winner-flash { animation: winner-flash 0.8s ease-in-out 2; }
        
        .win-splash-text {
            background: linear-gradient(90deg, #facc15, #fef08a, #facc15);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
