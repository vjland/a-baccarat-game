<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Stake Baccarat Clone - Vanilla</title>
    <link rel="icon" href="data:image/svg+xml,<svg width='512' height='512' viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'><defs><radialGradient id='darkBg' cx='50%' cy='50%' r='50%'><stop offset='0%' style='stop-color:%231a1a2e;stop-opacity:1' /><stop offset='100%' style='stop-color:%23020205;stop-opacity:1' /></radialGradient><linearGradient id='neonCyan' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' style='stop-color:%2300f2ff;stop-opacity:1' /><stop offset='100%' style='stop-color:%230066ff;stop-opacity:1' /></linearGradient><filter id='glow' x='-20%' y='-20%' width='140%' height='140%'><feGaussianBlur stdDeviation='6' result='blur' /><feComposite in='SourceGraphic' in2='blur' operator='over' /></filter></defs><rect width='512' height='512' rx='100' fill='url(%23darkBg)' /><circle cx='256' cy='256' r='220' fill='none' stroke='url(%23neonCyan)' stroke-width='8' filter='url(%23glow)' opacity='0.8' /><rect x='190' y='150' width='110' height='160' rx='12' fill='%23ffffff' transform='rotate(-10 245 230)' opacity='0.1' stroke='%2300f2ff' stroke-width='2' /><rect x='230' y='140' width='110' height='160' rx='12' fill='%2300f2ff' transform='rotate(15 285 220)' opacity='0.2' stroke='%23ffffff' stroke-width='2' /><text x='50%' y='52%' dominant-baseline='middle' text-anchor='middle' style='fill:%23ffffff; font-family: sans-serif; font-size: 220px; font-weight: 900; filter: url(%23glow);'>B</text><text x='50%' y='85%' dominant-baseline='middle' text-anchor='middle' style='fill:url(%23neonCyan); font-family: sans-serif; font-size: 28px; letter-spacing: 12px; font-weight: bold; text-transform: uppercase;'>BACCARAT</text><rect x='0' y='0' width='512' height='512' rx='100' fill='white' opacity='0.03' style='pointer-events:none;'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #05080a;
            color: #e5e5e5;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            height: 100dvh; /* Dynamic viewport height */
        }
        .safe-area-inset {
            padding-bottom: env(safe-area-inset-bottom);
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes win-burst {
            0% { transform: scale(0.5); opacity: 0; filter: blur(10px); }
            20% { transform: scale(1.1); opacity: 1; filter: blur(0); }
            80% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.2); opacity: 0; }
        }
        .animate-win-burst { animation: win-burst 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes winner-flash {
            0%, 100% { filter: brightness(1) drop-shadow(0 0 0px transparent); transform: scale(1); }
            50% { filter: brightness(1.3) drop-shadow(0 0 15px currentColor); transform: scale(1.05); }
        }
        .animate-winner-flash { animation: winner-flash 0.8s ease-in-out 2; }
        
        .win-splash-text {
            background: linear-gradient(90deg, #facc15, #fef08a, #facc15);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hand-container.winner {
            animation: winner-flash 0.8s ease-in-out 2;
        }
    </style>
</head>
<body class="flex flex-col overflow-hidden text-white safe-area-inset">
    <!-- Win Splash Layer -->
    <div id="win-splash-layer"></div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 z-[110] bg-black/80 backdrop-blur-md flex items-center justify-center p-6 hidden">
        <div class="bg-[#1a2b33] border border-white/10 rounded-2xl w-full max-w-sm p-6 shadow-2xl">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-black uppercase tracking-widest text-white">Settings</h3>
                <button id="close-settings" class="text-neutral-500 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>
            
            <div class="space-y-8">
                <div class="flex items-center justify-between">
                    <span class="text-sm font-bold text-neutral-400 uppercase">Auto Deal</span>
                    <button id="toggle-auto" class="w-14 h-8 rounded-full transition-colors relative bg-neutral-800">
                        <div id="auto-knob" class="absolute top-1 w-6 h-6 rounded-full bg-white transition-all left-1"></div>
                    </button>
                </div>

                <div id="interval-config" class="opacity-40 pointer-events-none">
                    <span class="text-sm font-bold text-neutral-400 uppercase mb-3 block">Interval (seconds)</span>
                    <div class="grid grid-cols-3 gap-2">
                        <button data-val="2" class="interval-btn py-3 rounded-xl font-black transition-all border bg-black/40 border-white/5 text-white">2s</button>
                        <button data-val="5" class="interval-btn py-3 rounded-xl font-black transition-all border bg-yellow-500 border-yellow-400 text-black">5s</button>
                        <button data-val="10" class="interval-btn py-3 rounded-xl font-black transition-all border bg-black/40 border-white/5 text-white">10s</button>
                    </div>
                </div>

                <div class="pt-4 border-t border-white/5" id="reset-container">
                    <!-- Reset button with confirmation will be injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Top Section: Table and Hands Display -->
    <div class="relative h-[40dvh] md:h-[45dvh] bg-gradient-to-b from-[#1a2b33] to-[#0a1217] flex flex-col items-center justify-center p-3 border-b border-white/10 shadow-2xl z-10">
        <div class="absolute top-2 md:top-4 left-4 md:left-6 flex items-center gap-2 md:gap-4">
            <button id="open-settings" class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-blue-500/10 flex items-center justify-center border border-blue-400/20 hover:bg-blue-500/30 transition-all">
                <i class="fas fa-cog text-blue-400 text-sm md:text-lg"></i>
            </button>
            <div class="text-[10px] md:text-sm font-black tracking-[0.1em] md:tracking-[0.2em] text-neutral-500 uppercase">STAKE EXTREME</div>
        </div>

        <div id="auto-indicator" class="absolute top-2 md:top-4 right-4 md:right-6 hidden items-center gap-2 md:gap-3">
            <div class="text-[8px] md:text-xs font-black text-green-500 uppercase tracking-widest animate-pulse">Auto Dealing</div>
            <div class="w-8 h-8 md:w-10 md:h-10 rounded-full border-2 border-green-500 flex items-center justify-center bg-black/60 shadow-lg shadow-green-500/20">
                <span id="countdown-text" class="text-xs md:text-sm font-black text-green-500">5</span>
            </div>
        </div>

        <!-- Burn status overlay -->
        <div id="initializing-label" class="absolute inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm hidden">
            <div class="text-center animate-pulse px-6">
                <p id="init-message" class="text-yellow-400 text-lg md:text-2xl font-black uppercase tracking-widest">Initializing...</p>
            </div>
        </div>

        <!-- End of Shoe overlay -->
        <div id="shoe-end-overlay" class="absolute inset-0 z-[60] flex items-center justify-center bg-black/80 backdrop-blur-md px-6 hidden">
            <div class="bg-[#1a2b33] border border-white/10 p-6 md:p-8 rounded-3xl shadow-2xl text-center max-w-sm">
                <div class="w-16 h-16 md:w-20 md:h-20 bg-yellow-500/10 border border-yellow-500/20 rounded-full flex items-center justify-center mx-auto mb-4 md:mb-6">
                    <i class="fas fa-redo text-yellow-500 text-2xl md:text-3xl"></i>
                </div>
                <h2 class="text-xl md:text-2xl font-black uppercase tracking-widest text-white mb-2">End of Shoe</h2>
                <p class="text-neutral-400 text-xs md:text-sm mb-6 md:mb-8 leading-relaxed">The current shoe has finished. Start a fresh 8-deck shoe to continue training.</p>
                <button id="new-shoe-confirm-btn" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-black py-3 md:py-4 rounded-xl uppercase tracking-widest transition-all active:scale-95 shadow-xl shadow-yellow-500/20">
                    New Shoe
                </button>
            </div>
        </div>

        <div class="flex gap-4 md:gap-36 w-full max-w-6xl items-center justify-center mt-2 md:mt-4 overflow-hidden">
            <!-- Player Hand -->
            <div id="player-hand" class="flex flex-col items-center gap-1 md:gap-4 transition-all hand-container">
                <div id="player-cards-grid" class="flex flex-col items-center gap-1 md:gap-3">
                    <!-- Cards injected here -->
                </div>
                <div class="relative">
                    <span id="player-label" class="text-sm md:text-2xl font-black bg-[#1565c0] px-4 md:px-10 py-1 md:py-2 rounded-full shadow-2xl border border-white/30 block">闲 0</span>
                </div>
            </div>

            <!-- Banker Hand -->
            <div id="banker-hand" class="flex flex-col items-center gap-1 md:gap-4 transition-all hand-container">
                <div id="banker-cards-grid" class="flex flex-col items-center gap-1 md:gap-3">
                    <!-- Cards injected here -->
                </div>
                <div class="relative">
                    <span id="banker-label" class="text-sm md:text-2xl font-black bg-[#c62828] px-4 md:px-10 py-1 md:py-2 rounded-full shadow-2xl border border-white/30 block">庄 0</span>
                </div>
            </div>
        </div>

        <!-- Action Button -->
        <div class="absolute bottom-2 md:bottom-8 w-full flex flex-col items-center justify-center">
            <button id="deal-button" class="bg-yellow-500 hover:bg-yellow-400 text-black px-10 md:px-16 py-2 md:py-4 rounded-xl md:rounded-2xl font-black text-lg md:text-2xl uppercase tracking-[0.1em] transition-all active:scale-95 shadow-2xl shadow-yellow-500/20">
                Deal
            </button>
        </div>
    </div>

    <!-- Middle: Roadmap Area -->
    <div class="flex-grow min-h-0 relative bg-[#050a0e] overflow-hidden" id="roadmap-container">
        <!-- Roadmap injected by main.js -->
    </div>

    <!-- Bottom: Betting Table -->
    <div id="betting-table-container" class="flex-shrink-0 z-20 pb-safe">
        <!-- Betting table injected by main.js -->
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
