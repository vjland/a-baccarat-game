
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stake Baccarat Clone - Vanilla</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%231a4731%22/><text y=%22.82em%22 x=%220.18em%22 font-size=%2270%22 font-weight=%22900%22 fill=%22%23facc15%22 font-family=%22serif%22>B</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #05080a; color: #e5e5e5; overflow: hidden; }
        .casino-gradient { background: radial-gradient(circle at center, #1a2b33 0%, #0a1217 100%); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes win-burst {
            0% { transform: scale(0.5); opacity: 0; filter: blur(10px); }
            20% { transform: scale(1.1); opacity: 1; filter: blur(0); }
            80% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.2); opacity: 0; }
        }
        .animate-win-burst { animation: win-burst 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes winner-flash {
            0%, 100% { filter: brightness(1) drop-shadow(0 0 0px transparent); transform: scale(1); }
            50% { filter: brightness(1.3) drop-shadow(0 0 15px currentColor); transform: scale(1.05); }
        }
        .animate-winner-flash { animation: winner-flash 0.8s ease-in-out 2; }
        
        .win-splash-text {
            background: linear-gradient(90deg, #facc15, #fef08a, #facc15);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">
    <div class="h-full flex flex-col w-full">
        <!-- Header / Table -->
        <div class="relative h-[55vh] casino-gradient flex flex-col items-center justify-center p-3 border-b border-white/10 shadow-2xl z-10">
            <div class="absolute top-4 left-6 flex items-center gap-4">
                <button id="settings-btn" class="w-12 h-12 rounded-full bg-blue-500/10 flex items-center justify-center border border-blue-400/20 hover:bg-blue-500/30 transition-all">
                    <i class="fas fa-cog text-blue-400 text-lg"></i>
                </button>
                <div class="text-sm font-black tracking-[0.2em] text-neutral-500 uppercase">STAKE EXTREME</div>
            </div>

            <div id="auto-status" class="absolute top-4 right-6 hidden flex items-center gap-3">
                <div class="text-xs font-black text-green-500 uppercase tracking-widest animate-pulse">Auto Dealing</div>
                <div class="w-10 h-10 rounded-full border-2 border-green-500 flex items-center justify-center bg-black/60 shadow-lg shadow-green-500/20">
                    <span id="timer-display" class="text-sm font-black text-green-500">10</span>
                </div>
            </div>

            <div id="initializing-label" class="absolute inset-0 flex items-center justify-center bg-black/40 backdrop-blur-sm z-50 hidden">
                <div class="text-center animate-pulse">
                    <p class="text-yellow-400 text-2xl font-black uppercase tracking-widest">Burn Card: <span id="burn-value"></span></p>
                </div>
            </div>

            <div class="flex gap-6 md:gap-36 w-full max-w-6xl items-center justify-center mt-4">
                <!-- Player Hand -->
                <div id="player-hand-container" class="flex flex-col items-center gap-2 md:gap-4 transition-all">
                    <div id="player-cards" class="flex flex-col items-center gap-1.5 md:gap-3 min-h-[140px] md:min-h-[220px]"></div>
                    <div class="relative">
                        <span class="text-xl md:text-2xl font-black bg-[#1565c0] px-8 md:px-10 py-2 rounded-full shadow-2xl border border-white/30 block">
                            闲 <span id="player-score">0</span>
                        </span>
                    </div>
                </div>

                <!-- Banker Hand -->
                <div id="banker-hand-container" class="flex flex-col items-center gap-2 md:gap-4 transition-all">
                    <div id="banker-cards" class="flex flex-col items-center gap-1.5 md:gap-3 min-h-[140px] md:min-h-[220px]"></div>
                    <div class="relative">
                        <span class="text-xl md:text-2xl font-black bg-[#c62828] px-8 md:px-10 py-2 rounded-full shadow-2xl border border-white/30 block">
                            庄 <span id="banker-score">0</span>
                        </span>
                    </div>
                </div>
            </div>

            <!-- Action Button -->
            <div id="deal-button-container" class="absolute bottom-4 md:bottom-8 w-full flex flex-col items-center justify-center hidden">
                <button id="deal-btn" class="bg-yellow-500 hover:bg-yellow-400 text-black px-16 py-4 rounded-2xl font-black text-2xl uppercase tracking-[0.1em] transition-all active:scale-95 shadow-2xl shadow-yellow-500/20">
                    Deal
                </button>
            </div>
        </div>

        <!-- Roadmap -->
        <div class="flex-grow min-h-0 relative bg-[#050a0e]">
            <div id="roadmap-wrapper" class="w-full h-full flex flex-col">
                <div class="flex items-center gap-3 px-2 py-0.5 bg-black/80 text-[8px] font-black text-neutral-500 border-b border-white/5">
                    <span id="shoe-count" class="opacity-40">#0</span>
                    <div class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-[#1565c0]"></span> <span id="stats-p">0</span></div>
                    <div class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-[#c62828]"></span> <span id="stats-b">0</span></div>
                    <div class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-[#2e7d32]"></span> <span id="stats-t">0</span></div>
                </div>
                <div class="flex-grow overflow-y-auto scrollbar-hide bg-[#0d161d]">
                    <div id="big-road" class="grid grid-rows-6 grid-flow-col bg-black/20 overflow-x-auto scrollbar-hide w-full content-start border-b border-white/5"></div>
                    <div id="big-eye-boy" class="grid grid-rows-6 grid-flow-col bg-black/10 overflow-x-auto scrollbar-hide w-full content-start border-b border-white/5"></div>
                    <div id="small-road" class="grid grid-rows-6 grid-flow-col bg-black/10 overflow-x-auto scrollbar-hide w-full content-start border-b border-white/5"></div>
                    <div id="cockroach-road" class="grid grid-rows-6 grid-flow-col bg-black/10 overflow-x-auto scrollbar-hide w-full content-start"></div>
                </div>
            </div>
        </div>

        <!-- Betting Table -->
        <div class="w-full bg-[#0f212e] p-2 md:p-3 flex flex-col gap-2 md:gap-4 rounded-t-3xl shadow-inner border-t border-white/5 z-20">
            <div class="flex gap-2 h-24 md:h-32" id="betting-areas"></div>
            <div class="flex items-center justify-between px-1 md:px-2 pb-2 md:pb-4">
                <div class="flex flex-col items-start min-w-[50px]">
                    <span class="text-[8px] text-neutral-500 uppercase font-bold tracking-widest">余额</span>
                    <span id="balance-display" class="text-sm md:text-lg font-black text-white">$10,000</span>
                </div>
                <div class="flex gap-2 items-center">
                    <button id="clear-btn" class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-white/5 flex items-center justify-center border border-white/10 text-neutral-400 hover:text-white transition-colors">
                        <i class="fas fa-undo text-xs"></i>
                    </button>
                    <div id="chip-selection" class="flex gap-1.5 md:gap-2 bg-black/20 p-1 rounded-full border border-white/5"></div>
                </div>
                <div class="flex flex-col items-end min-w-[50px]">
                    <span class="text-[8px] text-neutral-500 uppercase font-bold tracking-widest">总下注</span>
                    <span id="total-bet-display" class="text-sm md:text-lg font-black text-yellow-500">$0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Panel -->
    <div id="settings-panel" class="fixed inset-0 z-[110] bg-black/80 backdrop-blur-md flex items-center justify-center p-6 hidden">
        <div class="bg-[#1a2b33] border border-white/10 rounded-2xl w-full max-w-sm p-6 shadow-2xl">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-black uppercase tracking-widest text-white">Settings</h3>
                <button id="settings-close" class="text-neutral-500 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="space-y-8">
                <div class="flex items-center justify-between">
                    <span class="text-sm font-bold text-neutral-400 uppercase">Auto Deal</span>
                    <button id="mode-auto" class="w-14 h-8 rounded-full transition-colors relative bg-neutral-800">
                        <div id="auto-toggle-knob" class="absolute top-1 w-6 h-6 rounded-full bg-white transition-all left-1"></div>
                    </button>
                </div>
                <div id="interval-panel" class="opacity-40 pointer-events-none">
                    <span class="text-sm font-bold text-neutral-400 uppercase mb-3 block">Interval (seconds)</span>
                    <div class="grid grid-cols-3 gap-2" id="interval-btns">
                        <button data-sec="2" class="py-3 rounded-xl font-black bg-black/40 border border-white/5 text-white">2s</button>
                        <button data-sec="5" class="py-3 rounded-xl font-black bg-black/40 border border-white/5 text-white">5s</button>
                        <button data-sec="10" class="py-3 rounded-xl font-black bg-black/40 border border-white/5 text-white">10s</button>
                    </div>
                </div>
                <button id="reset-shoe-btn" class="w-full py-3 bg-red-600/20 border border-red-500/30 rounded-xl text-red-500 font-black uppercase">New Shoe</button>
            </div>
        </div>
    </div>

    <script type="module" src="logic.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
